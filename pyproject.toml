[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glomerulonephritis-classifier-engine"
version = "2.0.0"
description = "GlomeruloMind: Renal Biopsy & Serology Glomerulonephritis Diagnostic Arbiter"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.26.0",
]

[project.scripts]
glomerulonephritis-classifier-engine = "glomerulonephritis_classifier_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/glomerulonephritis-classifier-agent"
Repository = "https://github.com/abusuraihsakhri/glomerulonephritis-classifier-agent"

[tool.setuptools]
py-modules = ["cli", "enrichment", "glomerulo_mind", "glomerulo_mind_app", "glomerulonephritis_classifier_agent_app", "simulator"]

[tool.setuptools.packages.find]
include = ["agents*", "glomerulonephritis_classifier_agent*"]
