name: Test, package and security checks

on:
  push:
    branches: [master, main, "audit/**"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile Python
        run: python -m compileall -q agents glomerulonephritis_classifier_agent cli.py glomerulo_mind.py enrichment.py
      - name: Run test suite
        run: python -m pytest -q
      - name: Verify audit signatures and PHI rejection
        run: |
          export AUDIT_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          python - <<'PY'
          from agents.base import AuditTrail, PHIGuard, SecurityException
          trail = AuditTrail()
          trail.log("ci", "test", "signed", {"case": "SYNTH-01"})
          assert trail.verify_integrity()
          trail.logs[0]["event_type"] = "forged"
          assert not trail.verify_integrity()
          try:
              PHIGuard.assert_no_phi("MRN-123456")
          except SecurityException:
              pass
          else:
              raise AssertionError("PHI guard did not reject MRN")
          PY
